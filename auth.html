<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>InboxOS</title>
        <meta name="description" content="InboxOS authentication">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles/stylesheet.css">
        <link rel="icon" type="image/x-icon" href="/styles/Favicon.ico" sizes="32x32">
    </head>
    <body>
        <header class="site-header">
            <a class="brand-logo" href="index.html" aria-label="Stratishield AI home">
                <img src="styles/stratishield-logo-on-dark.svg" alt="Stratishield AI">
            </a>
        </header>

        <main class="auth-main">
            <h1>Sign in to InboxOS</h1>
            <p>Use an account authorized by your Microsoft organization.</p>
            <button id="microsoftSignInButton" type="button" hidden>Continue with Microsoft</button>
            <button id="developerModeButton" type="button" hidden>Continue without Microsoft sign-in (developer mode)</button>
        </main>

        <script src="developer-mode.js"></script>
        <script src="App.js"></script>
    </body>
</html>
